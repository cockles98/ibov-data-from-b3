[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "B", "UP", "S", "N"]
ignore = ["S101"]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101"]
